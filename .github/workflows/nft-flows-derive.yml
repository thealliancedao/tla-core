# nft-flows-derive — archives on main (archive/fcd/*, tla-flows/raw/*, nfts/raw/*) → nfts/<collection>/ledger/ (the on-chain event ledger; nfts/adao/flows/ is the separate daily state-diff product)
# (month files, primary-sales.json with USD at the day, lineage.json for locks, index.json with coverage + known gaps).
# No node access: reads what is committed, writes what it derives. Idempotent; re-run after any walk or FCD harvest.
# Dispatch only (one-time rebuilds); forward capture is the Render cron org-nft-flows, which merges incrementally.
name: nft-flows-derive
on:
  workflow_dispatch:
    inputs:
      collections:
        description: 'comma list of registry keys (blank = all)'
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: nft-flows-derive
  cancel-in-progress: false
jobs:
  derive:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts/nft-flows
            docs/curated/nft-collections.json
            archive/fcd
            tla-flows/raw
            nfts/raw
            nfts/adao/ledger
            nfts/pixel/ledger
            nfts/tla-locks/ledger
            nfts/adao/snapshots/luna-usd-daily.json
            nfts/adao/provenance/tokens
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: gate the classifier first
        run: node .github/scripts/nft-flows/gate-classify.mjs .
      - name: derive
        env:
          COLLECTIONS: ${{ inputs.collections }}
        run: node .github/scripts/nft-flows/derive.js
      - name: commit (pull --rebase + retry — main moves every few minutes under the Render crons)
        run: |
          git config user.name "nft-flows-derive" && git config user.email "bot@thealliancedao.com"
          git add nfts/*/ledger
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -m "nft-flows derive $(date -u +%Y-%m-%dT%H:%M)Z"
          for i in 1 2 3 4 5 6; do
            git pull --rebase origin main && git push origin HEAD:main && echo "pushed on try $i" && exit 0
            echo "push try $i lost the race — retrying"; sleep $((i * 15))
          done
          echo "could not push after 6 tries — re-run the workflow (derive is idempotent)"; exit 1
