# ONE-OFF (2026-08-10, step-2 continuity): bank legacy astroport dailies into
# tla-core dex-data/astroport/daily-csv (additive-only, org-wins, blob-sha
# verified). Dispatch report → review → apply. Retire after verified.
name: astro-daily-bank
on:
  workflow_dispatch:
    inputs:
      phase:
        description: 'report | apply'
        required: true
        default: 'report'
        type: choice
        options: [report, apply]
permissions:
  contents: write
jobs:
  bank:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: fetch script from this repo
        run: |
          curl -sL "https://raw.githubusercontent.com/${{ github.repository }}/main/.github/scripts/astro-daily-bank/bank.js?cb=$(date +%s)" -o bank.js
          node --check bank.js
      - name: run phase
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          PHASE: ${{ inputs.phase }}
        run: node bank.js
