# archive-walk — the ACCESS-WINDOW walk (PLAN-archive-window-walk).
# SELF-CHAINING: dispatch ONCE with from_height + final_height; each
# successful chunk (~450k blocks, sized for the 6h Actions limit)
# dispatches the next until final_height is reached. A failure (including
# the census gate) STOPS the chain — re-dispatch from the failure point.
# Raw parts are write-once, merges idempotent: overlaps are harmless.
name: tla-flows-archive-walk
on:
  workflow_dispatch:
    inputs:
      from_height:
        description: 'walk FROM height (inclusive)'
        required: true
      final_height:
        description: 'self-chain until this height (inclusive)'
        required: false
        default: '21481530'
      to_height:
        description: 'OPTIONAL single-chunk override (blank = auto-chunk + chain)'
        required: false
        default: ''
permissions:
  contents: write
  actions: write
concurrency:
  group: tla-flows-archive-walk
  cancel-in-progress: false
jobs:
  walk:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts/tla-flows
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: archive walk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCHIVE_RPC: ${{ secrets.ARCHIVE_RPC }}
          WALK_FROM: ${{ inputs.from_height }}
          WALK_TO: ${{ inputs.to_height }}
          FINAL_HEIGHT: ${{ inputs.final_height }}
        run: node .github/scripts/tla-flows/archive-walk.js
