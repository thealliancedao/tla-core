name: votion-holders — every Votion depositor since launch (archive node)

# 2026-10-16: the public LCDs have pruned early history, so the votion cron could not discover early depositors. This reads every
# vault's full deposit history from the archive node and writes candidates to votion/archive-holders.json; the votion cron verifies
# each by live balance. Runs on push of this file / the script, weekly, or by hand.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['.github/workflows/votion-holders.yml', '.github/scripts/votion-holders/**']
  schedule:
    - cron: '41 4 * * 1'
permissions:
  contents: write
concurrency:
  group: votion-holders
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts/votion-holders
            votion/archive-holders.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: scan
        env:
          ARCHIVE_RPC: ${{ secrets.ARCHIVE_RPC }}
        run: |
          git config user.name "votion-holders" && git config user.email "bot@thealliancedao.com"
          node .github/scripts/votion-holders/scan.mjs
