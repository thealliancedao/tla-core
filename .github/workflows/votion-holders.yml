name: "Archive · Votion depositors"

# 2026-10-16: the public LCDs have pruned early history, so the votion cron could not discover early depositors. This reads every
# vault's full deposit history from the archive node and writes candidates to votion/archive-holders.json; the votion cron verifies
# each by live balance. Runs by hand only.
# 2026-11-25 (owner): the archive node is for backfill only, started by a person. The timer and the start-on-push were removed;
# this workflow now runs ONLY from "Run workflow". Anything newer has to come from the forward capture, which does not use the archive.
on:
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: votion-holders
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts/votion-holders
            votion/archive-holders.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: scan
        env:
          ARCHIVE_RPC: ${{ secrets.ARCHIVE_RPC }}
        run: |
          git config user.name "votion-holders" && git config user.email "bot@thealliancedao.com"
          node .github/scripts/votion-holders/scan.mjs
