name: Deep Walk

# SPEC-deep-history §8 — the deep-history backfill, LAYER 1 (every tx of every cohort wallet) into the PRIVATE repo
# thealliancedao/tla-archive. Runs here (public repo: unlimited Action minutes); writes there with ARCHIVE_REPO_TOKEN.
# Modes: timing (how fast the archive answers — run first) · cohort (the cut-date wallet list — once) · layer1 (resumable; run again
# until the log says every wallet is done) · layer2 (protocol state weekly) · layer3 (monthly bank + staking checkpoints per wallet) · flows (every balance change rebuilt from layer 1, checked against layer 3) · inventory (every contract the cohort touched, labeled — an aggregate, no wallets, into tla-core) · gapfill (1.8: what the audit found missing, then flows + audit again) · closeout (1.9: settles what is left without re-walking, price pools for unpriced tokens, re-audit) · audit (1.7: what the archive holds vs what the derive needs — counts only into docs/deep-history/audit.json; run before any more node time). PRIVACY (§8b): memos are never stored; this log prints counts only.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'timing → cohort → layer1 → inventory → layer2 → layer3 → flows → audit → gapfill → closeout (layer2 / layer3 / gapfill / closeout re-start themselves until done — see chain)'
        required: true
        type: choice
        options: ['timing', 'cohort', 'layer1', 'inventory', 'layer2', 'layer3', 'flows', 'audit', 'gapfill', 'closeout']
        default: 'timing'
      concurrency:
        description: 'layer1: wallets walked at once (use what timing showed the node can take)'
        required: false
        type: string
        default: '4'
      max_minutes:
        description: 'stop cleanly after this many minutes (the job limit is 6 h)'
        required: false
        type: string
        default: '320'
      shards:
        description: 'layer1: only wallets ending in these characters, e.g. "0-9" or "a,c" (empty = all) — lets two runs work in parallel'
        required: false
        type: string
      limit_wallets:
        description: 'layer1: walk at most this many wallets this run (0 = all) — use 5 for a first test'
        required: false
        type: string
        default: '0'
      audit_sample:
        description: 'audit: wallets in the chain samples (cw20 check, missed search keys) — 80 takes ~20–40 min of node time'
        required: false
        type: string
        default: '80'
      chain:
        description: 'layer2 / layer3: how many more runs may start themselves after this one if reads are left (0 = stop after this run)'
        required: false
        type: string
        default: '4'
permissions:
  contents: write   # inventory / audit each commit ONE aggregate file (contracts-seen.json / audit.json) to tla-core (docs/deep-history/contracts-seen.json — counts, no wallets)
  actions: write    # layer2 starts its own next run while reads are left (bounded by the chain input)
concurrency:
  group: deep-walk-${{ github.event.inputs.mode }}-${{ github.event.inputs.shards }}
jobs:
  walk:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts/deep-walk
            docs/deep-history
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: decoder
        run: cd .github/scripts/deep-walk && npm init -y >/dev/null && npm i --no-audit --no-fund cosmjs-types@0.9.0 >/dev/null
      - name: the private archive
        env:
          TOKEN: ${{ secrets.ARCHIVE_REPO_TOKEN }}
        run: |
          git clone -q --depth 1 "https://x-access-token:${TOKEN}@github.com/thealliancedao/tla-archive.git" archive
          cd archive && git config user.name "deep-walk" && git config user.email "bot@thealliancedao.com"
      - name: walk
        env:
          MODE: ${{ github.event.inputs.mode }}
          CONCURRENCY: ${{ github.event.inputs.concurrency }}
          MAX_MINUTES: ${{ github.event.inputs.max_minutes }}
          SHARDS: ${{ github.event.inputs.shards }}
          LIMIT_WALLETS: ${{ github.event.inputs.limit_wallets }}
          ARCHIVE_RPC: ${{ secrets.ARCHIVE_RPC }}
          ARCHIVE_LCD: ${{ secrets.ARCHIVE_LCD }}
          FLOW_KEY: ${{ secrets.FLOW_KEY }}
          AUDIT_SAMPLE: ${{ github.event.inputs.audit_sample }}
          ARCHIVE_DIR: archive
          CORE_OUT: docs/deep-history
        run: node .github/scripts/deep-walk/walk.mjs
      - name: publish the contract inventory (aggregate only)
        if: github.event.inputs.mode == 'inventory'
        run: |
          git config user.name "deep-walk" && git config user.email "bot@thealliancedao.com"
          git add docs/deep-history/contracts-seen.json
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "deep-history: contracts the cohort touched ($(date -u +%Y-%m-%d))"
          for i in 1 2 3 4 5 6; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep $((i * 15)); done; exit 1
      - name: publish the audit (counts only — the script refuses to write it if a cohort wallet would appear)
        if: always() && (github.event.inputs.mode == 'audit' || github.event.inputs.mode == 'gapfill' || github.event.inputs.mode == 'closeout')
        run: |
          git config user.name "deep-walk" && git config user.email "bot@thealliancedao.com"
          [ -f docs/deep-history/audit.json ] || { echo "no public audit written — read the log above"; exit 0; }
          git add docs/deep-history/audit.json
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "deep-history: backfill audit ($(date -u +%Y-%m-%d))"
          for i in 1 2 3 4 5 6; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep $((i * 15)); done; exit 1
      - name: layer2 / layer3 / gapfill / closeout — start the next run while reads are left (bounded by chain)
        if: always() && (github.event.inputs.mode == 'layer2' || github.event.inputs.mode == 'layer3' || github.event.inputs.mode == 'gapfill' || github.event.inputs.mode == 'closeout')
        env:
          GH_TOKEN: ${{ github.token }}
          CHAIN: ${{ github.event.inputs.chain }}
          CONC: ${{ github.event.inputs.concurrency }}
          MAXM: ${{ github.event.inputs.max_minutes }}
          MODE: ${{ github.event.inputs.mode }}
        run: |
          if [ -f "${MODE}_stop.txt" ]; then echo "the run stopped itself (reads failing) — no next run; read the route test / failures lines above"; exit 0; fi
          LEFT=$(cat ${MODE}_left.txt 2>/dev/null || echo 1)
          echo "reads left: $LEFT · chain: $CHAIN"
          if [ "$LEFT" != "0" ] && [ "${CHAIN:-0}" -gt 0 ]; then
            gh workflow run deep-walk.yml --ref main -f mode="$MODE" -f concurrency="$CONC" -f max_minutes="$MAXM" -f chain=$((CHAIN - 1))
            echo "started the next $MODE run (chain $((CHAIN - 1)) left)"
          fi
