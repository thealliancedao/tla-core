name: CAPA Supply Probe

# One-off, READ-ONLY (2026-08-24): reads every custody form CAPA can sit in for
# the listed wallets plus collection totals, and prints them. This is the fixture
# for the CAPA supply-map duty (docs/pending-changes/SPEC-capa-supply-map.md).
# Writes nothing, commits nothing. Trigger from the Actions tab; read the run log
# and download the JSON artifact.

on:
  workflow_dispatch:
    inputs:
      wallets:
        description: 'Comma-separated wallets (default: aDAO treasury + owner fixture wallet)'
        required: false
        type: string
      lcd:
        description: 'LCD base URL'
        required: false
        type: string
        default: 'https://terra-lcd.publicnode.com'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run probe
        env:
          WALLETS: ${{ github.event.inputs.wallets }}
          LCD: ${{ github.event.inputs.lcd }}
        run: node .github/scripts/capa-supply/probe.mjs
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: capa-supply-probe
          path: capa-supply-probe.json
