name: tla-flows-rebuild-index (one-off repair)
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/tla-flows/rebuild-index.js
