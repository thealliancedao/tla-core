# =============================================================================
# ONE-OFF: distributions history harvest (SPEC-distributions-capture §2)
# Dispatch manually from the Actions tab. Safe to re-run (idempotent — a run
# over complete history is a no-op). Delete this workflow at leisure once the
# floor certificate is committed, same as the retained-gap-fill pattern.
#
# Token: needs write access to thealliancedao/tla-core. Uses the same secret
# name as the org's other one-off Actions — if yours differs, edit the one
# `DATA_REPO_TOKEN` line below.
# =============================================================================
name: harvest-distributions (one-off)
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = walk + report only, publish nothing"
        required: false
        default: "0"

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run harvest
        env:
          GITHUB_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          GITHUB_REPO: thealliancedao/tla-core
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: node tla-voting/harvest-distributions.js
