# nft-flows-walk — walk ONE collection's watch set over a height span and archive matched txs as write-once raw parts
# (nfts/raw/<collection>/<from>-<to>/). SELF-CHAINING: dispatch once with from_height + final_height; each run walks
# ≤ CHUNK blocks and dispatches the next. Uses the ARCHIVE_RPC secret for the pruned span (Jan 2025 → Jun 2026);
# set rpc_url to a public RPC for the retained span instead. PACE_MS sleeps after every node call — be kind to the archive.
# After the chain finishes, run nft-flows-derive to turn raw parts into flows. SPEC: docs/pending-changes/SPEC-nft-flows.md
name: nft-flows-walk
on:
  workflow_dispatch:
    inputs:
      collection:
        description: 'registry key in docs/curated/nft-collections.json (pixel | adao | tla-locks)'
        required: true
        default: 'pixel'
      from_height:
        description: 'walk FROM height (inclusive)'
        required: true
      final_height:
        description: 'self-chain until this height (inclusive); blank = single chunk'
        required: false
        default: '21481530'
      to_height:
        description: 'OPTIONAL single-chunk override (blank = auto-chunk + chain)'
        required: false
        default: ''
      rpc_url:
        description: 'OPTIONAL public RPC for the retained span (blank = ARCHIVE_RPC secret)'
        required: false
        default: ''
      pace_ms:
        description: 'sleep after every node call (ms)'
        required: false
        default: '250'
      chunk_blocks:
        description: 'blocks per run'
        required: false
        default: '300000'
permissions:
  contents: write
  actions: write
concurrency:
  group: nft-flows-walk-${{ inputs.collection }}
  cancel-in-progress: false
jobs:
  walk:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts/nft-flows
            docs/curated/nft-collections.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: walk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCHIVE_RPC: ${{ inputs.rpc_url == '' && secrets.ARCHIVE_RPC || '' }}
          RPC_URL: ${{ inputs.rpc_url }}
          COLLECTION: ${{ inputs.collection }}
          WALK_FROM: ${{ inputs.from_height }}
          WALK_TO: ${{ inputs.to_height }}
          FINAL_HEIGHT: ${{ inputs.final_height }}
          PACE_MS: ${{ inputs.pace_ms }}
          CHUNK_BLOCKS: ${{ inputs.chunk_blocks }}
        run: node .github/scripts/nft-flows/walk.js
