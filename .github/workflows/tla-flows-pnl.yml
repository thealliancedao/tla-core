name: tla-flows-pnl (Phase A rollup build)
on:
  workflow_dispatch: {}
  schedule:
    - cron: '30 3 * * 1'   # Mondays 03:30 UTC — after the Sunday voting rollup window
permissions:
  contents: write
concurrency:
  group: tla-flows-pnl
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Build P&L rollup (pure derive — no chain access)
        run: node .github/scripts/tla-flows/build-pnl.js
      - name: Commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "tla-flows-pnl[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add tla-flows/pnl/
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "tla-flows/pnl: Phase A rollup rebuild"
          git push
