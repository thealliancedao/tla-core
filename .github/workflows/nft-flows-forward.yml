# nft-flows-forward — ONE-TIME fill (dispatch only, never scheduled): walks every registered collection from the last
# height any archive on disk covers → chain head on a public RPC, then derives. Use it once after a backfill to close the
# span up to the moment the Render cron (platform-crons/nfts/nft-flows, org-nft-flows, hourly) takes over. Scheduled
# capture is a Render job by doctrine; Actions are for backfills and one-time runs. SPEC: docs/pending-changes/SPEC-nft-flows.md
name: nft-flows-forward
on:
  workflow_dispatch:
    inputs:
      collections:
        description: 'comma list of registry keys (blank = all)'
        required: false
        default: ''
      rpc_url:
        description: 'public RPC (retention span)'
        required: false
        default: 'https://terra-rpc.publicnode.com'
permissions:
  contents: write
concurrency:
  group: nft-flows-forward
  cancel-in-progress: false
jobs:
  forward:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts/nft-flows
            docs/curated/nft-collections.json
            archive/fcd
            tla-flows/raw
            nfts/raw
            nfts/adao/ledger
            nfts/pixel/ledger
            nfts/tla-locks/ledger
            nfts/adao/snapshots/luna-usd-daily.json
            nfts/adao/provenance/tokens
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: walk every collection to head (raw parts land on main via the API)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RPC_URL: ${{ inputs.rpc_url || 'https://terra-rpc.publicnode.com' }}
          COLLECTIONS: ${{ inputs.collections }}
          PACE_MS: '250'
        run: node .github/scripts/nft-flows/forward.js
      - name: pull the parts this run just wrote
        run: git pull --rebase origin main
      - name: gate + derive
        run: |
          node .github/scripts/nft-flows/gate-classify.mjs .
          node .github/scripts/nft-flows/derive.js
      - name: commit (pull --rebase + retry)
        run: |
          git config user.name "nft-flows-forward" && git config user.email "bot@thealliancedao.com"
          git add nfts/*/ledger nfts/forward-summary.json
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -m "nft-flows forward $(date -u +%Y-%m-%dT%H:%M)Z"
          for i in 1 2 3 4 5 6; do
            git pull --rebase origin main && git push origin HEAD:main && echo "pushed on try $i" && exit 0
            echo "push try $i lost the race — retrying"; sleep $((i * 15))
          done
          exit 1
