# ONE-OFF (2026-08-10, strip #3 prereq 1b): relabel the SS weekly-avg series to
# canonical epoch numbers (legacy stamped +1), gap-fill dailies from the legacy
# repo, rebuild missing canonical epochs. THREE HUMAN-GATED PHASES — dispatch
# report, review dex-data/skeletonswap/relabel-report.json, then apply, verify,
# then prune. Retire this workflow (disable + delete) once prune is verified.
name: ss-weekly-relabel
on:
  workflow_dispatch:
    inputs:
      phase:
        description: 'report | apply | prune (run in order; review between each)'
        required: true
        default: 'report'
        type: choice
        options: [report, apply, prune]

permissions:
  contents: write

jobs:
  relabel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: fetch script from this repo
        run: |
          curl -sL "https://raw.githubusercontent.com/${{ github.repository }}/main/.github/scripts/ss-weekly-relabel/relabel.js?cb=$(date +%s)" -o relabel.js
          node --check relabel.js
      - name: run phase
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          PHASE: ${{ inputs.phase }}
        run: node relabel.js
