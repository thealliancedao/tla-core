# walk-supervisor — auto-heal for the tla-flows archive walk chain.
# WHY: run #15 was canceled by GitHub infrastructure ("The operation was
# canceled." — runner reclaim); the dying run never fired its self-chain
# dispatch, so the walk sat dead until a human noticed. This checks every
# 2 hours and re-dispatches from the failure point when (and only when)
# no walk run is queued or in progress. Read-only otherwise; safe to leave
# scheduled after the walk completes (it detects completion and exits).
# Disable or delete after the access window closes.
name: tla-flows-walk-supervisor
on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch: {}
permissions:
  contents: read
  actions: write
concurrency:
  group: tla-flows-walk-supervisor
  cancel-in-progress: false
jobs:
  supervise:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts/tla-flows
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: supervise walk chain
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/tla-flows/walk-supervisor.js
