name: TLA History Backfill

# Governance EVENT capture seed: votes + locks + bribes + rewards.
# Spec: docs/pending-changes/SPEC-tla-history.md
#
# Builds history/events/ "as if the Render cron ran all along"; org-tla-history
# (platform-crons/history) forward-maintains from cursor.json afterward.
#
# FIRST RUN: mode = sample — scans recent txs on all three contracts, prints
# every action key + samples + a live reward-amount extraction test, WRITES
# NOTHING. The incentive manager has never been scanned; review its map before
# seeding. THEN: mode = full to seed. Re-runs are safe (append-only + dedup +
# shrink-guarded).
#
# BATCH-5 ARCHIVE DEEPENING (later): set archive_lcd to the archive node and
# re-run full — events below the recorded horizons append; horizons only move
# down. Same workflow, no code change.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "sample = probe/dry-run (prints action keys, writes nothing) | full = seed/forward + write"
        type: choice
        default: sample
        options: [sample, full]
      archive_lcd:
        description: "OPTIONAL archive-node LCD (Batch 5 deepening). Leave empty for public nodes."
        type: string
        default: ""
      lcd_primary:
        description: "Primary LCD endpoint"
        type: string
        default: "https://terra-lcd.publicnode.com"
      lcd_fallback:
        description: "Fallback LCD endpoint"
        type: string
        default: "https://terra-rest.publicnode.com"
      seed_max_pages:
        description: "Hard page ceiling per contract (100 txs/page). Gauge unfiltered ~190p, escrow ~110p."
        type: string
        default: "600"
      pager_retries:
        description: "Probes per page (publicnode is flaky per-request; higher = more robust)."
        type: string
        default: "40"
      pager_err_backoff:
        description: "Backoff after an error/empty page (ms)."
        type: string
        default: "250"
      pager_probe_delay:
        description: "Delay between probes of the same page (ms)."
        type: string
        default: "40"

permissions:
  contents: write

concurrency:
  group: tla-history-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run TLA history seed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_BRANCH: ${{ github.ref_name }}
          RUN_MODE: ${{ inputs.mode }}
          ARCHIVE_LCD: ${{ inputs.archive_lcd }}
          LCD_PRIMARY: ${{ inputs.lcd_primary }}
          LCD_FALLBACK: ${{ inputs.lcd_fallback }}
          SEED_MAX_PAGES: ${{ inputs.seed_max_pages }}
          PAGER_RETRIES: ${{ inputs.pager_retries }}
          PAGER_ERR_BACKOFF: ${{ inputs.pager_err_backoff }}
          PAGER_PROBE_DELAY: ${{ inputs.pager_probe_delay }}
        run: node .github/scripts/tla-history/tla-history-seed.js
